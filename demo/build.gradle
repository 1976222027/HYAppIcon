plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.mhy.hyappicon.demo'
    compileSdk 34

    defaultConfig {
        applicationId "com.mhy.HYAppIcon.demo"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    boolean useAlias = false //是否使用别名的方式
    sourceSets {
        main {
            if (useAlias) {
                manifest.srcFile 'src/alias/AndroidManifest.xml'
            } else {
                manifest.srcFile'src/main/AndroidManifest.xml'
            }
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation project(':appicon')
//    implementation 'com.gitee.mahongyin:HYAppIcon:0.0.8'
}